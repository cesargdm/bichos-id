name: 'Deploy Web (Cloudflare Workers)'

on:
  push:
    branches:
      - main
    paths:
      - 'apps/next/**'
      - 'packages/app/**'
      - 'bun.lock'
      - 'package.json'
      - '.github/workflows/deploy-web.yml'

concurrency:
  group: deploy-web-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    name: Build and deploy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # This job used to be gated on `vars.CLOUDFLARE_DEPLOY_READY == 'true'` so
    # it would skip quietly before the first cutover. The variable was never
    # set, so every deploy since has skipped — a green tick on a merge that
    # shipped nothing, which took a day to notice. A missing credential should
    # fail loudly instead.
    permissions:
      contents: read
    steps:
      # An unset secret or variable expands to an empty string rather than
      # failing, and most of these don't stop the build: an empty
      # NEXT_PUBLIC_ORIGIN just bakes relative/localhost URLs into the
      # prerendered pages and og:image tags, so the deploy reports success and
      # ships subtly broken output. Check them before anything runs.
      - name: Verify deploy configuration
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          NEXT_PUBLIC_ORIGIN: ${{ vars.NEXT_PUBLIC_ORIGIN }}
        run: |
          missing=()
          for name in CLOUDFLARE_ACCOUNT_ID CLOUDFLARE_API_TOKEN NEXT_PUBLIC_ORIGIN; do
            [ -n "${!name}" ] || missing+=("$name")
          done
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::Missing required deploy configuration: ${missing[*]}"
            exit 1
          fi

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          # Matches `packageManager` in the root package.json. `latest` makes a
          # deploy depend on whatever Bun released that morning.
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # `opennextjs-cloudflare build` runs `next build` itself, which includes
      # its own "Running TypeScript" phase — a separate `tsc --noEmit` step
      # here would fail on a clean checkout anyway, since next-env.d.ts
      # references .next/types/*.d.ts files that only exist after that build.
      #
      # Static/ISR pages (/, /explore, /sitemap.xml) are rendered during this
      # build step, not at request time, so build-time env vars matter here
      # even though POSTGRES_URL etc. are otherwise only Worker *secrets*
      # (runtime bindings, invisible to this local build).
      - name: Build and deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: ./apps/next
          preCommands: bunx opennextjs-cloudflare build
          command: deploy
        env:
          NEXT_PUBLIC_ORIGIN: ${{ vars.NEXT_PUBLIC_ORIGIN }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
