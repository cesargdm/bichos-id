name: 'Deploy Web (Cloudflare Workers)'

on:
  push:
    branches:
      - main
    paths:
      - 'apps/next/**'
      - 'packages/app/**'
      - '.github/workflows/deploy-web.yml'

jobs:
  deploy:
    name: Build and deploy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Typecheck
        run: bun run typecheck
        working-directory: ./apps/next

      - name: Build and deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: ./apps/next
          preCommands: bunx opennextjs-cloudflare build
          command: deploy

      - name: Upload sourcemaps to Sentry
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
        run: bunx sentry-cli sourcemaps upload .open-next
        working-directory: ./apps/next
