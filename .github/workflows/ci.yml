name: 'CI'

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    strategy:
      # Report every failing check in one run, rather than hiding the second
      # problem behind the first.
      fail-fast: false
      matrix:
        include:
          - name: Lint
            command: bun run lint
          - name: Format
            command: bun run format:check
          - name: Typecheck
            command: bun run typecheck
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          # Matches `packageManager` in the root package.json, so CI can't break
          # because Bun shipped a release that morning.
          bun-version: 1.3.14

      # The three checks are separate jobs so each reports its own status and
      # can be required independently — the cost is repeating the install, which
      # this cache absorbs.
      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          path: ~/.bun/install/cache
          restore-keys: ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: ${{ matrix.name }}
        run: ${{ matrix.command }}
